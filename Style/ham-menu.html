<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu" />
        <title>Hamburger Menu</title>
        <style>
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                background: rgb(235, 236, 242);
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .center {
                width: 900px;
                height: auto;
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                justify-content: center;
                margin: 0;
                margin-top: 20px; 
            }

            .menu {
                width: 100%;
                height: fit-content;
                box-sizing: border-box;
                background: rgb(37, 38, 53);
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            .logo {
                width: fit-content;
                font-family: poppins;
                font-size: 32px;
                color: whitesmoke;
                font-weight: 600;
                padding: 15px;
                box-sizing: border-box;
                display: flex;
                align-items: center;
                justify-content: space-between;

            }

            #menu {
                display: none;

            }

            .logo label {
                display: none;
            }

            .items {
                width: fit-content;
                display: flex;
                align-items: center;
                justify-content: center;

            }

            .item {
                width: 100px;
                padding: 10px 18px;
                box-sizing: border-box;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 5mm;
                font-family: poppins;
                font-size: 16px;
                color: whitesmoke;
                text-decoration: none;
            }

            .item:hover {
                background: rgba(100, 100, 100, 0.5);
            }

            @media screen and (max-width: 650px) {
                .center {
                    width: 100%;
                    margin-top: 0;
                }

                .menu {
                    flex-direction: column;
                }

                .menu .logo {
                    width: 100%;
                }

                .menu .logo label {
                    display: block;
                    cursor: pointer;
                    position: relative;
                    width: 30px;
                    height: 30px;

                }

                .menu .logo label::before {
                    position: absolute;
                    top: 0;
                    left: 0;

                }

                .menu .items {
                    width: 100%;
                    flex-direction: column;
                    max-height: 0;
                    overflow: hidden;
                    transition: 0.5s ease-in-out;

                }

                .menu .item {
                    width: 100%;
                    padding: 15px;
                    border-radius: 0;
                    border-top: 0.5mm solid rgb(52, 53, 71);
                }

                #menu:checked ~ .items {
                    max-height: 500px;

                }


            }

            .headerbox {
                width: 900px;
                height: auto;
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                justify-content: center;
                margin: 0;
                margin-top: 20px;
                background:
                    linear-gradient(40deg, #3e515b, #4d6471, #a76d5e, #c4a071);
                border-radius: 30px 30px 0 0;
                border-bottom:

                    1px solid rgba(255, 255, 255, 0.5);

                box-shadow:

                    0 10px 30px rgba(0,0,0,.25);
                
            }

            .nav {
                width: 100%;
                height: fit-content;
                box-sizing: border-box;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            .headerbox .logo-two {
                display: flex;
            }

            .logo-two label {
                display: none;
            }

            .axis-logo img {
                width: 100px;
                height: 100px;
                border-radius: 50%;
                padding: 15px;
            }

            .axis-logo img:hover{

                transform:rotate(8deg) scale(1.08);

            }

            .nav-bar {
                width: fit-content;
                height: 60px;
                display: flex;
                align-items: center;
                justify-content: center;
                margin-right: 20px;
                gap: 10px;
                border-radius: 40px;

                border: 2px solid rgba(255, 255, 255, 0.5);

                background:

                    rgba(255,255,255,.05);

                backdrop-filter:blur(26px);

                box-shadow: 
                    6px 6px 10px -2px rgba(255, 255, 255, .78),
                    inset 4px 4px 8px -2px rgba(25, 25, 25, .5);
            }

            .nav-link {
                display:flex;

                justify-content:center;

                align-items:center;

                width: 100px;
                height: 40px;

                border-radius: 40px;

                color:white;

                font-size:16px;

                font-weight:500;

                transition:.35s;

                text-decoration: none;
            }

            .nav-link:hover {
                background:

                    linear-gradient(
                        135deg,
                        #3E515B,
                        #4D6471
                    );

                transform:

                    translateY(-2px);

                box-shadow:

                    0 10px 25px rgba(62,81,91,.35);
            }

            .active{

                background:

                    linear-gradient(
                        80deg,
                        #708f96,
                        #aa895f
                    );

                color:white;

            }

            @media screen and (max-width: 650px) {
                .headerbox {
                    width: 100%;
                    border-radius: 0;
                    margin-top: 0;
                }

                .nav {
                    flex-direction: column;
                }

                .headerbox .logo-two {
                    width: 100%;
                    flex-direction: row;
                    align-items: center;
                    justify-content: space-between;
                }

                .headerbox .logo-two label {
                    display: block;
                    cursor: pointer;
                    position: relative;
                    width: 30px;
                    height: 30px;
                    color: whitesmoke;
                    padding: 15px;
                }

                .headerbox .logo-two label::before {
                    position: absolute;
                    top: 0;
                    left: 0;
                }

                .nav-bar {
                    flex-direction: column;
                    width: 80%;
                    max-height: 0;
                    overflow: hidden;
                    transition: 0.34s ease-in-out;
                    border: none;
                    border-radius: 0;
                }

                #menu:checked ~ .nav-bar {
                    max-height: 600px;
                    border-radius: 20px;
                    height: auto;
                    margin: 0;
                    margin-bottom: 10px;
                    border: 2px solid rgba(255, 255, 255, .78);
                    right: 0;
                }

                #menu:checked ~ .nav-bar .nav-link {
                    animation: slideIn 0.4s ease forwards;
                }

                .nav-link {
                    width: 80%;
                    margin-top: 10px;
                    font-size: 24px;
                    border-top: 0.5mm solid rgba(255, 255, 255, 0.315);
                    padding-top: 10px;
                    padding-bottom: 10px;
                }

                .nav-bar .nav-link {
                    opacity: 0;
                    transform: translateX(25px);
                }

                #menu:checked ~ .nav-bar .nav-link:nth-child(1) {
                    animation-delay: 1s;
                }

                #menu:checked ~ .nav-bar .nav-link:nth-child(2) {
                    animation-delay: 1.5s;
                }

                #menu:checked ~ .nav-bar .nav-link:nth-child(3) {
                    animation-delay: 2s;
                }

                #menu:checked ~ .nav-bar .nav-link:nth-child(4) {
                    animation-delay: 2.5s;
                }

                #menu:checked ~ .nav-bar .nav-link:nth-child(5) {
                    animation-delay: 3s;
                }

                #menu:checked ~ .nav-bar .nav-link:nth-child(6) {
                    animation-delay: 3.5s;
                }

                @keyframes slideIn {

                    from {
                        opacity: 0;
                        transform: translateY(25px);
                    }

                    to {
                        opacity: 1;
                        transform: translateY(0);
                    }

                }

   
            }
